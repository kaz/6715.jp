name: deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.66.0
      - run: bun install --frozen-lockfile
      # `bun run build` also rewrites posts/1.html to posts/1/index.html, so
      # deploy that output as is instead of letting Void build again.
      - run: bun run build
      - run: bunx void deploy --platform cloudflare --skip-build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
